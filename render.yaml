# Render Blueprint for the backend (https://render.com/docs/blueprint-spec).
# The database lives in Neon (free Postgres); paste its credentials when Render asks.
services:
  - type: web
    name: f1nallap-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://f1nallap.netlify.app,http://localhost:4200
      - key: INGEST_ADMIN_API_KEY
        generateValue: true
      # Render free instances have 512 MB of RAM.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k
